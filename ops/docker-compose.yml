services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: humanoid
      POSTGRES_PASSWORD: humanoid
      POSTGRES_DB: humanoid
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanoid"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  pgdata:
